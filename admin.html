<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>英検4級 管理画面</title>
<style>
:root{
  --ink:#25313f; --muted:#6b7a8d; --line:#dfe6ef; --bg:#f4f7fb; --card:#ffffff;
  --main:#2b6cb0; --main-dark:#1a4971; --accent:#e8a33d; --bad:#d9534f; --good:#2f9e58;
  --cell:20px;
  --lv0:#e8edf4; --lv1:#bcd3ee; --lv2:#7fabdc; --lv3:#3f7fc4; --lv4:#1a4971;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
[hidden]{display:none !important;}
button,select,input{font:inherit; color:inherit;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
h1,h2,h3{margin:0; line-height:1.35;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- パスワード画面 ---------- */
#gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.gate-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px; width:100%; max-width:380px;}
.gate-box h1{font-size:1.25rem; margin-bottom:6px;}
.gate-box p{margin:0 0 18px; color:var(--muted); font-size:.9rem;}
.gate-box label{display:block; font-size:.85rem; font-weight:600; margin-bottom:6px;}
.gate-box input{width:100%; padding:11px 12px; border:1px solid #c6d2e1; border-radius:8px; background:#fff;}
.gate-box button{margin-top:14px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--main); color:#fff; font-weight:700; cursor:pointer;}
.gate-box button:hover{background:var(--main-dark);}
.gate-box button:disabled{opacity:.6; cursor:wait;}
.gate-msg{margin-top:12px; font-size:.88rem; min-height:1.4em;}
.gate-msg.err{color:var(--bad);}

/* ---------- 全体 ---------- */
.topbar{background:var(--main-dark); color:#fff;}
.topbar-in{max-width:1040px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.topbar h1{font-size:1.1rem; flex:1 1 auto;}
.topbar .stamp{font-size:.78rem; opacity:.85;}
.btn-ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.55); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:.85rem;}
.btn-ghost:hover{background:rgba(255,255,255,.14);}
.wrap{max-width:1040px; margin:0 auto; padding:18px;}

.summary{display:flex; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:16px;}
.stat{flex:1 1 150px; padding:14px 18px; border-right:1px solid var(--line);}
.stat:last-child{border-right:0;}
.stat .v{font-size:1.5rem; font-weight:700; color:var(--main-dark); line-height:1.2;}
.stat .v small{font-size:.8rem; font-weight:500; color:var(--muted); margin-left:2px;}
.stat .l{font-size:.8rem; color:var(--muted);}

.filters{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:14px;}
.filters label{font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:6px;}
.filters select{padding:7px 10px; border:1px solid #c6d2e1; border-radius:8px; background:#fff;}

.tabs{display:flex; gap:4px; border-bottom:2px solid var(--line); margin-bottom:18px; overflow-x:auto;}
.tab{background:none; border:0; padding:10px 18px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap;}
.tab[aria-selected="true"]{color:var(--main-dark); border-bottom-color:var(--main);}

.panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px;}
.panel h2{font-size:1.05rem; margin-bottom:4px;}
.panel .sub{color:var(--muted); font-size:.85rem; margin:0 0 14px;}
.note{background:#fff8e8; border:1px solid #f1dca8; border-radius:8px; padding:10px 12px; font-size:.88rem; margin-bottom:14px;}
.empty{padding:26px 10px; text-align:center; color:var(--muted);}

/* ---------- 回答日カレンダー（この画面の目玉） ---------- */
.user-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; margin-bottom:12px;}
.user-head h2{font-size:1.15rem; margin:0;}
.user-meta{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:.85rem; color:var(--muted);}
.user-meta b{color:var(--ink); font-weight:700;}
.cal-wrap{overflow-x:auto; padding-bottom:6px;}
.cal{display:inline-flex; gap:8px;}
.cal-days{display:flex; flex-direction:column; gap:3px; padding-top:18px; font-size:.7rem; color:var(--muted);}
.cal-days span{height:var(--cell); line-height:var(--cell);}
.cal-main{display:flex; flex-direction:column; gap:3px;}
.cal-months{display:flex; gap:3px; height:15px; font-size:.7rem; color:var(--muted);}
.cal-months span{width:var(--cell); white-space:nowrap; overflow:visible;}
.cal-cols{display:flex; gap:3px;}
.cal-cols .col{display:flex; flex-direction:column; gap:3px;}
.cell{display:block; width:var(--cell); height:var(--cell); border-radius:3px; background:var(--lv0);}
.cell.future{background:transparent;}
.cell.lv1{background:var(--lv1);} .cell.lv2{background:var(--lv2);}
.cell.lv3{background:var(--lv3);} .cell.lv4{background:var(--lv4);}
.legend{display:flex; align-items:center; gap:4px; font-size:.75rem; color:var(--muted); margin-top:6px;}
.legend .cell{width:12px; height:12px;}

/* ---------- 表 ---------- */
.tbl-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:.88rem;}
th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
th{font-size:.78rem; color:var(--muted); font-weight:600; white-space:nowrap;}
td.r,th.r{text-align:right;}
.qtext{min-width:240px;}
.chip{display:inline-block; font-size:.72rem; padding:1px 8px; border-radius:99px; background:#e8f0fa; color:var(--main-dark); margin-bottom:3px;}
.meter{display:flex; align-items:center; gap:8px; min-width:130px;}
.meter .track{flex:1; height:8px; background:var(--lv0); border-radius:99px; overflow:hidden;}
.meter .fill{height:100%; border-radius:99px;}
.meter .val{width:3.2em; text-align:right; font-weight:700;}
.btn-more{margin-top:10px; background:#fff; border:1px solid #c6d2e1; border-radius:8px; padding:7px 14px; cursor:pointer; font-size:.85rem;}
.btn-more:hover{background:#f0f5fb;}

/* ---------- 傾向 ---------- */
.insights{margin:0; padding-left:1.2em;}
.insights li{margin-bottom:6px;}
.chart svg{width:100%; height:auto; display:block;}
.chart text{font-size:11px; fill:#6b7a8d;}
.legend-users{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.82rem; margin-bottom:8px;}
.legend-users i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px;}
.bars{display:flex; flex-direction:column; gap:9px;}
.bar-row{display:grid; grid-template-columns:8.5em 1fr 8em; gap:10px; align-items:center; font-size:.88rem;}
.bar-row .track{height:12px; background:var(--lv0); border-radius:99px; overflow:hidden;}
.bar-row .fill{height:100%; border-radius:99px;}
.bar-row .t{text-align:right; font-variant-numeric:tabular-nums;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.heat td,.heat th{text-align:center; padding:8px 6px;}
.heat td:first-child,.heat th:first-child{text-align:left;}
.heat .n{display:block; font-size:.7rem; color:#55637a;}

@media (max-width:720px){
  .two-col{grid-template-columns:1fr;}
  .bar-row{grid-template-columns:6.5em 1fr 6.5em;}
  .stat{flex-basis:45%;}
  :root{--cell:15px;}
  .wrap{padding:12px;}
}
@media (prefers-reduced-motion:no-preference){
  .meter .fill,.bar-row .fill{transition:width .35s ease;}
}
</style>
</head>
<body>

<!-- パスワード画面 -->
<div id="gate">
  <form class="gate-box" id="gate-form" autocomplete="off">
    <h1>英検4級 管理画面</h1>
    <p>先生用のページです。パスワードを入力してください。</p>
    <label for="pw">パスワード</label>
    <input id="pw" type="password" required autocomplete="current-password">
    <button type="submit" id="gate-btn">ひらく</button>
    <div class="gate-msg" id="gate-msg" role="status"></div>
  </form>
</div>

<!-- 管理画面 -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <h1>英検4級 学習状況</h1>
      <span class="stamp" id="stamp"></span>
      <button class="btn-ghost" id="btn-refresh">最新にする</button>
      <button class="btn-ghost" id="btn-logout">閉じる</button>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" id="summary" aria-label="全体のまとめ"></section>

    <div class="filters">
      <label>ユーザー
        <select id="f-user"></select>
      </label>
      <label>期間
        <select id="f-period">
          <option value="all">すべて</option>
          <option value="30">直近30日</option>
          <option value="7">直近7日</option>
        </select>
      </label>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="days">回答日</button>
      <button class="tab" role="tab" data-tab="questions">問題別の成績</button>
      <button class="tab" role="tab" data-tab="trends">傾向</button>
    </div>

    <div id="content"></div>
  </main>
</div>

<script>
(function(){
"use strict";

/* ===== 設定 ===== */
// クイズアプリと同じ、GAS（スプレッドシートの受け口）のURL
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwjmkqmHK1Zgu8AJx_ZAmW2OzZ54B4G5HOJuhr593Qtca64bqm2yRr3aGvQlO72IVfa/exec";
const CAT_NAMES = {vocab:"語句補充問題", dialogue:"会話文完成問題", order:"語句整序問題", reading:"読解問題", tango:"英単語"};
const CAT_ORDER = ["語句補充問題","会話文完成問題","語句整序問題","読解問題","英単語"];
const WD = ["日","月","火","水","木","金","土"];
const PALETTE = ["#2b6cb0","#e8a33d","#2f9e58","#9b4fa0","#d9534f","#0f9fb0","#8a7a2b","#6b7a8d"];

/* ===== 状態 ===== */
let password = "";
let ALL = {S:[], A:[]};
const UI = {tab:"days", user:"", period:"all", cat:"", sort:"low", more:{}};

/* ===== 道具 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (c,t) => t ? Math.round(c/t*100) : 0;
const md  = d => (d.getMonth()+1)+"/"+d.getDate();
const mdw = d => md(d)+"("+WD[d.getDay()]+")";
const pad = n => String(n).padStart(2,"0");
const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hue = p => Math.round(Math.max(0,Math.min(100,p))*1.3);          // 0%=赤 → 100%=緑
const accFill = p => "hsl("+hue(p)+",62%,44%)";
const accSoft = p => "hsl("+hue(p)+",62%,88%)";

function parseDate(s){
  const m = String(s).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0));
}
function ago(d){
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const d0 = new Date(d); d0.setHours(0,0,0,0);
  const n = Math.round((t0-d0)/86400000);
  return n<=0 ? "今日" : n===1 ? "昨日" : n+"日前";
}

/* ===== データ取得 ===== */
async function fetchData(pw){
  let res, json;
  try{
    res = await fetch(ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action:"read", password:pw})
    });
  }catch(e){
    throw new Error("データを取得できませんでした。インターネットの接続と、GASの公開設定（アクセスできるユーザー：全員）を確認してください。");
  }
  try{ json = await res.json(); }
  catch(e){
    throw new Error("GASの返事を読み取れませんでした。GASを新しいコード（Code.gs）に入れ替えて、「新しいバージョン」でデプロイし直したか確認してください。");
  }
  if(!json.ok){
    if(json.error==="wrong_password") throw new Error("パスワードが違います。");
    if(json.error==="not_configured") throw new Error("GASにパスワードが登録されていません。スクリプト プロパティに ADMIN_PASSWORD を登録してください。");
    throw new Error("GASからエラーが返りました（"+esc(json.error||"不明")+"）。");
  }
  const S = (json.sessions||[]).map(r=>({
    t:parseDate(r[0]), name:String(r[1]||"(未登録)"), cat:String(r[2]||""),
    correct:+r[3]||0, total:+r[4]||0
  })).filter(x=>x.t && x.total>0).sort((a,b)=>a.t-b.t);
  const A = (json.answers||[]).map(r=>({
    t:parseDate(r[0]), name:String(r[1]||"(未登録)"), qid:String(r[2]||""), cat:String(r[3]||""),
    text:String(r[4]||""), ok:r[5]==="○", pick:String(r[6]||""), right:String(r[7]||"")
  })).filter(x=>x.t && x.qid).sort((a,b)=>a.t-b.t);
  ALL = {S, A};
}

/* ===== 絞り込み ===== */
function cutoff(){
  if(UI.period==="all") return null;
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(+UI.period-1));
  return d;
}
function view(ignorePeriod){
  const c = ignorePeriod ? null : cutoff();
  const ok = x => (!UI.user || x.name===UI.user) && (!c || x.t>=c);
  return {S:ALL.S.filter(ok), A:ALL.A.filter(ok)};
}

/* ===== 画面の骨組み ===== */
function fillUsers(){
  const names = [...new Set(ALL.S.map(s=>s.name).concat(ALL.A.map(a=>a.name)))].sort((a,b)=>a.localeCompare(b,"ja"));
  const sel = $("f-user");
  const cur = names.includes(UI.user) ? UI.user : "";
  UI.user = cur;
  sel.innerHTML = '<option value="">全員</option>' + names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
  sel.value = cur;
}
function renderSummary(){
  const v = view();
  const q = v.S.reduce((a,s)=>a+s.total,0);
  const c = v.S.reduce((a,s)=>a+s.correct,0);
  const last = v.S.length ? v.S[v.S.length-1].t : null;
  $("summary").innerHTML =
    stat(v.S.length,"回","取り組んだ回数") +
    stat(q,"問","解いた問題数") +
    stat(q?pct(c,q):"–", q?"%":"", "全体の正答率") +
    stat(last?ago(last):"–","", last?("最後に回答した日 "+mdw(last)):"最後に回答した日");
}
function stat(v,unit,label){
  return '<div class="stat"><div class="v num">'+esc(v)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div><div class="l">'+esc(label)+'</div></div>';
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===UI.tab ? "true":"false"));
  renderSummary();
  const el = $("content");
  if(ALL.S.length===0 && ALL.A.length===0){
    el.innerHTML = '<div class="panel empty">まだ記録がありません。クイズアプリで10問解くと、ここに表示されます。</div>';
    return;
  }
  el.innerHTML = UI.tab==="days" ? tabDays() : UI.tab==="questions" ? tabQuestions() : tabTrends();
}

/* ===== ① 回答日 ===== */
function tabDays(){
  const v = view(true);               // カレンダーは期間に関係なく直近16週
  if(v.S.length===0) return '<div class="panel empty">このユーザーの記録はまだありません。</div>';
  const groups = new Map();
  v.S.forEach(s=>{ if(!groups.has(s.name)) groups.set(s.name,[]); groups.get(s.name).push(s); });
  const users = [...groups.entries()].sort((a,b)=>b[1][b[1].length-1].t - a[1][a[1].length-1].t);
  return users.map(([name, list])=>userCard(name, list)).join("") +
    '<div class="legend"><span>少ない</span><i class="cell lv0"></i><i class="cell lv1"></i><i class="cell lv2"></i><i class="cell lv3"></i><i class="cell lv4"></i><span>多い（その日に解いた問題数）</span></div>';
}
function userCard(name, list){
  const WEEKS = 16;
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today);
  start.setDate(today.getDate() - ((today.getDay()+6)%7) - (WEEKS-1)*7);   // 月曜はじまり
  const byDay = {};
  list.forEach(s=>{ const k=dayKey(s.t); const o=byDay[k]||(byDay[k]={q:0,c:0}); o.q+=s.total; o.c+=s.correct; });

  let months="", cols="", lastM=-1, activeDays=0;
  for(let w=0; w<WEEKS; w++){
    const ws = new Date(start); ws.setDate(start.getDate()+w*7);
    months += "<span>"+(ws.getMonth()!==lastM ? (ws.getMonth()+1)+"月" : "")+"</span>";
    lastM = ws.getMonth();
    let cells="";
    for(let r=0; r<7; r++){
      const d = new Date(ws); d.setDate(ws.getDate()+r);
      if(d>today){ cells+='<i class="cell future"></i>'; continue; }
      const rec = byDay[dayKey(d)];
      const q = rec ? rec.q : 0;
      if(rec) activeDays++;
      const lv = q===0?0 : q<10?1 : q<25?2 : q<50?3 : 4;
      const tip = rec ? mdw(d)+"："+q+"問、正答率"+pct(rec.c,rec.q)+"%" : mdw(d)+"：回答なし";
      cells += '<i class="cell lv'+lv+'" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" tabindex="0"></i>';
    }
    cols += '<div class="col">'+cells+'</div>';
  }
  // 今の連続日数（今日まだなら昨日から数える）
  let streak=0, d=new Date(today);
  if(!byDay[dayKey(d)]) d.setDate(d.getDate()-1);
  while(byDay[dayKey(d)]){ streak++; d.setDate(d.getDate()-1); }

  const q = list.reduce((a,s)=>a+s.total,0), c = list.reduce((a,s)=>a+s.correct,0);
  const last = list[list.length-1].t;
  const key = "u:"+name;
  const sorted = list.slice().reverse();
  const shown = UI.more[key] ? sorted : sorted.slice(0,8);
  const rows = shown.map(s=>{
    const p = pct(s.correct,s.total);
    return '<tr><td class="num">'+esc(mdw(s.t))+" "+pad(s.t.getHours())+":"+pad(s.t.getMinutes())+'</td><td>'+esc(s.cat)+
           '</td><td class="num r">'+s.correct+" / "+s.total+'</td><td>'+meter(p)+'</td></tr>';
  }).join("");

  return '<section class="panel">'+
    '<div class="user-head"><h2>'+esc(name)+'</h2><div class="user-meta">'+
      '<span>回答日数（直近16週） <b class="num">'+activeDays+'日</b></span>'+
      '<span>連続 <b class="num">'+streak+'日</b></span>'+
      '<span>最後 <b>'+esc(mdw(last))+'（'+esc(ago(last))+'）</b></span>'+
      '<span>通算の正答率 <b class="num">'+pct(c,q)+'%</b></span>'+
    '</div></div>'+
    '<div class="cal-wrap"><div class="cal">'+
      '<div class="cal-days"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span></span></div>'+
      '<div class="cal-main"><div class="cal-months">'+months+'</div><div class="cal-cols">'+cols+'</div></div>'+
    '</div></div>'+
    '<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>日時</th><th>カテゴリ</th><th class="r">正解 / 問題</th><th>正答率</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (sorted.length>8 && !UI.more[key] ? '<button class="btn-more" data-more="'+esc(key)+'">すべての回（'+sorted.length+'回）を表示</button>' : '')+
  '</section>';
}
function meter(p){
  return '<div class="meter"><div class="track"><div class="fill" style="width:'+p+'%;background:'+accFill(p)+'"></div></div><span class="val num">'+p+'%</span></div>';
}

/* ===== ② 問題別の成績 ===== */
function tabQuestions(){
  const v = view();
  let note = "";
  if(ALL.A.length===0){
    return '<div class="panel"><h2>問題別の成績</h2><div class="note">1問ずつの記録は、まだありません。更新したクイズアプリで10問を最後まで解くと、ここに表示されます。</div></div>';
  }
  const m = new Map();
  v.A.forEach(a=>{
    if(UI.cat && a.cat!==UI.cat) return;
    let o = m.get(a.qid);
    if(!o){ o = {qid:a.qid, cat:a.cat, text:a.text, right:a.right, n:0, ok:0, wrong:{}}; m.set(a.qid,o); }
    o.n++; if(a.ok) o.ok++; else o.wrong[a.pick] = (o.wrong[a.pick]||0)+1;
  });
  let list = [...m.values()];
  if(UI.sort==="low") list.sort((a,b)=> (a.ok/a.n)-(b.ok/b.n) || b.n-a.n);
  else if(UI.sort==="high") list.sort((a,b)=> (b.ok/b.n)-(a.ok/a.n) || b.n-a.n);
  else list.sort((a,b)=> b.n-a.n);

  const catOpts = '<option value="">すべて</option>' + Object.keys(CAT_NAMES).map(k=>'<option value="'+k+'"'+(UI.cat===k?" selected":"")+'>'+CAT_NAMES[k]+'</option>').join("");
  const sortOpts = [["low","正答率が低い順"],["high","正答率が高い順"],["many","回答数が多い順"]]
    .map(x=>'<option value="'+x[0]+'"'+(UI.sort===x[0]?" selected":"")+'>'+x[1]+'</option>').join("");

  const shown = UI.more.q ? list : list.slice(0,30);
  const rows = shown.map(o=>{
    const p = pct(o.ok,o.n);
    const wrongTop = Object.entries(o.wrong).sort((a,b)=>b[1]-a[1])[0];
    return '<tr><td class="qtext"><span class="chip">'+esc(CAT_NAMES[o.cat]||o.cat)+'</span><br>'+esc(o.text)+'</td>'+
      '<td class="num r">'+o.n+'</td><td>'+meter(p)+'</td>'+
      '<td>'+(wrongTop ? esc(wrongTop[0])+' <span class="num" style="color:var(--muted)">（'+wrongTop[1]+'回）</span>' : '<span style="color:var(--muted)">なし</span>')+'</td>'+
      '<td>'+esc(o.right)+'</td></tr>';
  }).join("");

  return '<section class="panel"><h2>問題ごとの正答率</h2>'+
    '<p class="sub">全員分の合計です。上のユーザー・期間で絞り込めます。正答率が低い問題は、解説をもう一度見直す候補です。</p>'+
    '<div class="filters"><label>カテゴリ<select id="q-cat">'+catOpts+'</select></label><label>並び順<select id="q-sort">'+sortOpts+'</select></label></div>'+
    (list.length===0 ? '<div class="empty">条件に合う記録がありません。</div>' :
    '<div class="tbl-wrap"><table><thead><tr><th>問題</th><th class="r">回答数</th><th>正答率</th><th>いちばん多い誤答</th><th>正解</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (list.length>30 && !UI.more.q ? '<button class="btn-more" data-more="q">すべての問題（'+list.length+'問）を表示</button>' : ''))+
  '</section>';
}

/* ===== ③ 傾向 ===== */
function catStats(v){
  const useA = v.A.length>0;
  const byUser = new Map(), total = new Map();
  const add = (user,cat,ok,n)=>{
    if(!byUser.has(user)) byUser.set(user,new Map());
    [byUser.get(user), total].forEach(mp=>{
      const o = mp.get(cat)||(mp.set(cat,{ok:0,n:0}), mp.get(cat));
      o.ok+=ok; o.n+=n;
    });
  };
  if(useA) v.A.forEach(a=>add(a.name, CAT_NAMES[a.cat]||a.cat, a.ok?1:0, 1));
  else v.S.filter(s=>!/復習|総合/.test(s.cat)).forEach(s=>add(s.name, s.cat, s.correct, s.total));
  const cats = [...total.keys()].sort((a,b)=>{
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b,"ja");
  });
  return {useA, byUser, total, cats};
}
function barRows(items){
  return '<div class="bars">'+items.map(it=>
    '<div class="bar-row"><div>'+esc(it.label)+'</div><div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,it.frac*100))+'%;background:'+it.color+'"></div></div><div class="t">'+esc(it.text)+'</div></div>'
  ).join("")+'</div>';
}
function insights(v, cs){
  const out = [];
  const q = v.S.reduce((a,s)=>a+s.total,0), c = v.S.reduce((a,s)=>a+s.correct,0);
  if(q) out.push("全体の正答率は "+pct(c,q)+"%（"+q+"問中 "+c+"問正解）です。");
  const ranked = cs.cats.map(k=>({k, p:pct(cs.total.get(k).ok,cs.total.get(k).n), n:cs.total.get(k).n})).filter(x=>x.n>=10);
  if(ranked.length>=2){
    ranked.sort((a,b)=>a.p-b.p);
    const lo = ranked[0], hi = ranked[ranked.length-1];
    if(lo.p!==hi.p){
      out.push("正答率がいちばん低いのは「"+lo.k+"」で "+lo.p+"%、いちばん高いのは「"+hi.k+"」で "+hi.p+"% です。");
    }
  }
  if(v.S.length>=6){
    const avg = arr=>Math.round(arr.reduce((a,s)=>a+pct(s.correct,s.total),0)/arr.length);
    const recent = v.S.slice(-3), before = v.S.slice(-6,-3);
    const d = avg(recent)-avg(before);
    out.push("直近3回の平均は "+avg(recent)+"% で、その前の3回（"+avg(before)+"%）より "+(d>0?"+":"")+d+" ポイントです。");
  }
  if(v.A.length){
    const m = new Map();
    v.A.forEach(a=>{ const o=m.get(a.qid)||(m.set(a.qid,{text:a.text,n:0,ok:0}), m.get(a.qid)); o.n++; if(a.ok) o.ok++; });
    const hard = [...m.values()].filter(o=>o.n>=2).sort((a,b)=>(a.ok/a.n)-(b.ok/b.n) || b.n-a.n)[0];
    if(hard && hard.ok<hard.n) out.push("2回以上解いて、正答率がいちばん低い問題は「"+hard.text.slice(0,40)+(hard.text.length>40?"…":"")+"」（"+pct(hard.ok,hard.n)+"%）です。");
  }
  if(v.S.length){
    const last = v.S[v.S.length-1].t;
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const d0 = new Date(last); d0.setHours(0,0,0,0);
    const gap = Math.round((t0-d0)/86400000);
    if(gap>=3) out.push("最後の回答から "+gap+" 日あいています。");
  }
  return out;
}
function lineChart(S){
  if(S.length===0) return "";
  const counts = {}; S.forEach(s=>counts[s.name]=(counts[s.name]||0)+1);
  const users = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,8);
  const W=720,H=270,L=40,R=16,T=14,B=30;
  const ts = S.map(s=>+s.t);
  let t0=Math.min(...ts), t1=Math.max(...ts);
  if(t0===t1){ t0-=43200000; t1+=43200000; }
  const x = t=>L+(t-t0)/(t1-t0)*(W-L-R);
  const y = p=>T+(100-p)/100*(H-T-B);
  let g="";
  [0,25,50,75,100].forEach(p=>{ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="#e3e9f1"/><text x="'+(L-6)+'" y="'+(y(p)+4)+'" text-anchor="end">'+p+'%</text>'; });
  for(let i=0;i<5;i++){
    const t = t0+(t1-t0)*i/4;
    g += '<text x="'+x(t)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(md(new Date(t)))+'</text>';
  }
  let lines="";
  users.forEach((u,i)=>{
    const col = PALETTE[i%PALETTE.length];
    const pts = S.filter(s=>s.name===u);
    if(pts.length>1) lines += '<polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+pts.map(s=>x(+s.t)+","+y(pct(s.correct,s.total))).join(" ")+'"/>';
    pts.forEach(s=>{
      const p = pct(s.correct,s.total);
      lines += '<circle cx="'+x(+s.t)+'" cy="'+y(p)+'" r="4" fill="'+col+'"><title>'+esc(u+"："+mdw(s.t)+" "+s.cat+" "+p+"%（"+s.correct+"/"+s.total+"）")+'</title></circle>';
    });
  });
  const legend = users.length>1 ? '<div class="legend-users">'+users.map((u,i)=>'<span><i style="background:'+PALETTE[i%PALETTE.length]+'"></i>'+esc(u)+'</span>').join("")+'</div>' : "";
  return legend+'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="正答率の推移">'+g+lines+'</svg></div>';
}
function tabTrends(){
  const v = view();
  if(v.S.length===0) return '<div class="panel empty">この条件の記録はまだありません。</div>';
  const cs = catStats(v);
  const tips = insights(v, cs);

  // カテゴリ別
  const catBars = barRows(cs.cats.map(k=>{
    const o = cs.total.get(k), p = pct(o.ok,o.n);
    return {label:k, frac:p/100, color:accFill(p), text:p+"%（"+o.n+"問）"};
  }));
  // ユーザー × カテゴリ
  const users = [...cs.byUser.keys()];
  const heat = '<div class="tbl-wrap"><table class="heat"><thead><tr><th>ユーザー</th>'+cs.cats.map(k=>'<th>'+esc(k)+'</th>').join("")+'</tr></thead><tbody>'+
    users.map(u=>'<tr><td>'+esc(u)+'</td>'+cs.cats.map(k=>{
      const o = cs.byUser.get(u).get(k);
      if(!o) return '<td style="color:var(--muted)">–</td>';
      const p = pct(o.ok,o.n);
      return '<td style="background:'+accSoft(p)+'"><b class="num">'+p+'%</b><span class="n">'+o.n+'問</span></td>';
    }).join("")+'</tr>').join("")+'</tbody></table></div>';
  // 曜日・時間帯
  const wd = [1,2,3,4,5,6,0].map(d=>({label:WD[d]+"曜日", n:v.S.filter(s=>s.t.getDay()===d).reduce((a,s)=>a+s.total,0)}));
  const slots = [["朝（5〜11時）",5,11],["昼（11〜16時）",11,16],["夕方（16〜19時）",16,19],["夜（19〜24時）",19,24],["深夜（0〜5時）",0,5]]
    .map(s=>({label:s[0], n:v.S.filter(x=>x.t.getHours()>=s[1] && x.t.getHours()<s[2]).reduce((a,x)=>a+x.total,0)}));
  const mk = arr=>{ const mx=Math.max(1,...arr.map(a=>a.n)); return barRows(arr.map(a=>({label:a.label, frac:a.n/mx, color:"var(--main)", text:a.n+"問"}))); };

  return '<section class="panel"><h2>気づいたこと</h2><p class="sub">記録から自動で計算した内容です。</p><ul class="insights">'+tips.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul></section>'+
    '<section class="panel"><h2>正答率の推移</h2><p class="sub">点は1回（10問ほど）の結果です。点に触れると詳しい内容が出ます。</p>'+lineChart(v.S)+'</section>'+
    '<section class="panel"><h2>カテゴリ別の正答率</h2><p class="sub">'+(cs.useA ? "1問ずつの記録から計算しています。" : "10問ごとの結果から計算しています（「復習」「ランダム総合」は除きます）。1問ずつの記録がたまると、より正確になります。")+'</p>'+catBars+'</section>'+
    '<section class="panel"><h2>ユーザー別・カテゴリ別</h2><p class="sub">色が赤いほど苦手、緑ほど得意です。</p>'+heat+'</section>'+
    '<section class="panel"><h2>いつ解いているか</h2><p class="sub">解いた問題数の合計です。</p><div class="two-col"><div>'+mk(wd)+'</div><div>'+mk(slots)+'</div></div></section>';
}

/* ===== 操作 ===== */
function showApp(){
  $("gate").hidden = true; $("app").hidden = false;
  const d = new Date();
  $("stamp").textContent = "取得 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  fillUsers(); render();
}
$("gate-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn = $("gate-btn"), msg = $("gate-msg"), pw = $("pw").value;
  btn.disabled = true; msg.className = "gate-msg"; msg.textContent = "読み込み中です…";
  try{
    await fetchData(pw);
    password = pw; $("pw").value = ""; msg.textContent = "";
    showApp();
  }catch(err){
    msg.className = "gate-msg err"; msg.textContent = err.message;
  }finally{ btn.disabled = false; }
});
$("btn-refresh").addEventListener("click", async ()=>{
  const b = $("btn-refresh"); b.disabled = true; b.textContent = "取得中…";
  try{ await fetchData(password); showApp(); }
  catch(err){ alert(err.message); }
  finally{ b.disabled = false; b.textContent = "最新にする"; }
});
$("btn-logout").addEventListener("click", ()=>{
  password = ""; ALL = {S:[],A:[]};
  $("app").hidden = true; $("gate").hidden = false; $("pw").focus();
});
$("f-user").addEventListener("change", e=>{ UI.user = e.target.value; render(); });
$("f-period").addEventListener("change", e=>{ UI.period = e.target.value; render(); });
document.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]");
  if(tab){ UI.tab = tab.dataset.tab; render(); return; }
  const more = e.target.closest("[data-more]");
  if(more){ UI.more[more.dataset.more] = true; render(); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="q-cat"){ UI.cat = e.target.value; render(); }
  if(e.target.id==="q-sort"){ UI.sort = e.target.value; render(); }
});
})();
</script>
